# Secret com a chave de sessao do SearXNG.
#
# NAO commitar o valor real. O placeholder abaixo existe so para documentar o
# formato; gere o seu e aplique por cima com:
#
#   kubectl -n nettools create secret generic searxng-secret \
#     --from-literal=SEARXNG_SECRET="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Como a instancia e interna e sem usuarios humanos (so o pod do nettools
# consome a API JSON), a chave so protege cookies de preferencia. Trocar a
# chave nao quebra nada alem de preferencias salvas.
apiVersion: v1
kind: Secret
metadata:
  name: searxng-secret
  namespace: nettools
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: nettools
type: Opaque
stringData:
  SEARXNG_SECRET: "CHANGE_ME"
