# SearXNG interno do cluster. Nao ha Ingress e nao ha NodePort: o unico
# consumidor e o pod do nettools, via ClusterIP.
#
# Contrato com a aplicacao (live.nettools.util.SearxngClient):
#   GET http://searxng:8080/search?q=<termo>&format=json
#   Accept: application/json / User-Agent: nettools/1.0 / timeout 15s
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: nettools
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: nettools
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
        app.kubernetes.io/part-of: nettools
    spec:
      initContainers:
        # O entrypoint da imagem roda `sed -i` em /etc/searxng/settings.yml para
        # substituir o placeholder da secret_key. Volume de ConfigMap e read-only,
        # entao montar direto faz o container falhar no boot. Copiamos para um
        # emptyDir gravavel.
        - name: seed-config
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              cp /configmap/settings.yml /configmap/limiter.toml /etc/searxng/
              chmod 0644 /etc/searxng/settings.yml /etc/searxng/limiter.toml
          volumeMounts:
            - name: configmap
              mountPath: /configmap
              readOnly: true
            - name: config
              mountPath: /etc/searxng
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: searxng
          # Tag fixada de proposito (nao usar :latest). O Docker Hub aplica rate
          # limit em pull nao autenticado, por isso GHCR.
          image: ghcr.io/searxng/searxng:2026.8.3-aa059419f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-secret
                  key: SEARXNG_SECRET
            # So tem efeito se o limiter for ligado no settings.yml.
            - name: SEARXNG_VALKEY_URL
              value: "valkey://valkey:6379/0"
            - name: SEARXNG_BASE_URL
              value: "http://searxng:8080/"
          volumeMounts:
            - name: config
              mountPath: /etc/searxng
            - name: cache
              mountPath: /var/cache/searxng
          # A imagem roda como root (config.User vazio) e o proprio entrypoint
          # faz chown de /etc/searxng e /var/cache/searxng e depois larga
          # privilegio para o usuario searxng. Por isso NAO se usa runAsNonRoot
          # nem fsGroup aqui, e as capabilities de chown/setuid/setgid precisam
          # continuar disponiveis.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - SETGID
                - SETUID
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: configmap
          configMap:
            name: searxng-config
        # Gravavel: o entrypoint precisa escrever no settings.yml.
        - name: config
          emptyDir: {}
        # A imagem grava faviconcache.db aqui. Cache descartavel, sem PVC.
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: nettools
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: nettools
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: searxng
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
